server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Echo identity headers so SSO validation is visible
    location / {
        add_header Cache-Control "no-store";
        add_header X-Proxied-By "library-test-resource";
        try_files $uri $uri/ /index.html;
    }

    location = /whoami {
        default_type application/json;
        return 200 '{"service":"test-resource","user":"$http_x_auth_request_user","email":"$http_x_auth_request_email","status":"ok"}';
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
