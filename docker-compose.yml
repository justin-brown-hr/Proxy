services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-analytics-db.sql:/docker-entrypoint-initdb.d/01-analytics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak} -d ${POSTGRES_DB:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: library-keycloak
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname=${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      - --hostname-strict=false
      - --http-enabled=true
      - --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    # Only localhost — public access goes through Nginx HTTPS
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - library-net
    restart: unless-stopped

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: library-oauth2-proxy
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-library-proxy-secret-change-me}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-15251ad9b910ec583bd425e34ed2bd04}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/library
      OAUTH2_PROXY_REDIRECT_URL: ${APP_URL:-http://localhost}/oauth2/callback
      OAUTH2_PROXY_LOGIN_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/library/protocol/openid-connect/auth
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-false}
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${PUBLIC_HOST:-localhost}
      OAUTH2_PROXY_SIGN_OUT_REDIRECT_URL: ${APP_URL:-http://localhost}/
      OAUTH2_PROXY_LOGOUT_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/library/protocol/openid-connect/logout
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - library-net
    restart: unless-stopped

  test-resource:
    image: nginx:1.27-alpine
    container_name: library-test-resource
    volumes:
      - ./test-resource/html:/usr/share/nginx/html:ro
      - ./test-resource/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - library-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: library-nginx
    command: ["/bin/sh", "-c", "touch /var/log/nginx/library_access.log && nginx -g 'daemon off;'"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/campus-ip.geo.conf:/etc/nginx/campus-ip.geo.conf:ro
      - ./nginx/resources.locations.conf:/etc/nginx/resources.locations.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - oauth2-proxy
      - test-resource
      - keycloak
      - publisher-simulator
      - guest-portal
    networks:
      - library-net
    restart: unless-stopped

  log-worker:
    build: ./log-worker
    container_name: library-log-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-keycloak}:${POSTGRES_PASSWORD:-keycloak}@postgres:5432/analytics
      NGINX_ACCESS_LOG: /var/log/nginx/library_access.log
      SCHEMA_PATH: /app/schema.sql
    volumes:
      - nginx_logs:/var/log/nginx:ro
    depends_on:
      postgres:
        condition: service_healthy
      nginx:
        condition: service_started
    networks:
      - library-net
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.51.2
    container_name: library-metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-keycloak}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-keycloak}
      MB_DB_HOST: postgres
      MB_SITE_URL: ${APP_URL:-https://proxy.bibliolatino.com}/metabase
      JAVA_OPTS: -Xmx1g
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - library-net
    restart: unless-stopped

  publisher-simulator:
    image: nginx:1.27-alpine
    container_name: library-publisher-simulator
    volumes:
      - ./publisher-simulator/html:/usr/share/nginx/html:ro
      - ./publisher-simulator/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - library-net
    restart: unless-stopped

  guest-portal:
    build: ./guest-portal
    container_name: library-guest-portal
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: library
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      GUEST_CLIENT_ID: guest-portal
      GUEST_CLIENT_SECRET: ${GUEST_CLIENT_SECRET:-guest-portal-secret-change-me}
      PUBLIC_APP_URL: ${APP_URL:-https://proxy.bibliolatino.com}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_KC_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_KC_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USERS_OU: ${LDAP_USERS_OU:-}
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - library-net
    restart: unless-stopped

volumes:
  postgres_data:
  nginx_logs:

networks:
  library-net:
    driver: bridge
