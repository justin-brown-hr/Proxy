# HTTP → HTTPS redirect (+ ACME challenge)
server {
    listen 80;
    server_name proxy.bibliolatino.com _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

upstream oauth2_proxy {
    server oauth2-proxy:4180;
}

upstream test_backend {
    server test-resource:80;
}

upstream keycloak_upstream {
    server keycloak:8080;
}

upstream guest_portal {
    server guest-portal:8000;
}

upstream metabase_upstream {
    server metabase:3000;
}

# HTTPS front door
server {
    listen 443 ssl;
    http2 on;
    server_name proxy.bibliolatino.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- Keycloak (SSO + admin) behind same HTTPS host ---
    location /realms/ {
        proxy_pass http://keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /resources/ {
        proxy_pass http://keycloak_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /js/ {
        proxy_pass http://keycloak_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- oauth2-proxy (always public; never behind auth_request) ---
    location = /logout {
        return 302 /oauth2/sign_out?rd=https%3A%2F%2F$host%2Frealms%2Flibrary%2Fprotocol%2Fopenid-connect%2Flogout%3Fclient_id%3Dlibrary-proxy%26post_logout_redirect_uri%3Dhttps%253A%252F%252F$host%252F;
    }

    location /oauth2/ {
        proxy_pass http://oauth2_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Redirect $oauth2_auth_redirect;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2_proxy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Campus IP → 200 (skip SSO). Remote users → oauth2-proxy auth_request.
    location = /auth-gate {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Original-URI $request_uri;

        if ($campus_ip = 1) {
            return 200;
        }
        proxy_pass http://oauth2_proxy/oauth2/auth;
    }

    location @error401 {
        return 302 /oauth2/start?rd=$scheme://$host$request_uri;
    }

    # --- Guest portal (Milestone 3) ---
    # Longer ^~ prefixes win over ^~ /guest/ (public). Admin stays SSO-gated.
    location = /guest {
        return 302 /guest/;
    }

    location ^~ /guest/admin {
        auth_request /auth-gate;
        auth_request_set $auth_user  $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        error_page 401 = @error401;

        proxy_pass http://guest_portal/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Request-User $auth_user;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /guest/api/admin/ {
        auth_request /auth-gate;
        auth_request_set $auth_user  $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        error_page 401 = @error401;

        proxy_pass http://guest_portal/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Request-User $auth_user;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Public: registration form, /api/register, assets, healthz
    location ^~ /guest/ {
        proxy_pass http://guest_portal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Public portal CSS/JS (used by home pages)
    location /assets/ {
        proxy_pass http://test_backend/assets/;
        proxy_set_header Host $host;
    }

    # Database portal (SSO protected)
    location = /databases {
        return 302 /databases.html;
    }

    location = /databases.html {
        auth_request /auth-gate;
        auth_request_set $auth_user  $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        error_page 401 = @error401;
        proxy_set_header X-Auth-Request-User $auth_user;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header Host $host;
        proxy_pass http://test_backend;
    }

    # Publisher reverse-proxy locations (generated from stanzas/*.yml)
    include /etc/nginx/resources.locations.conf;

    # Metabase analytics (own login; CSV/XML/PDF export built-in)
    location = /metabase {
        return 302 /metabase/;
    }

    location /metabase/ {
        proxy_pass http://metabase_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Home / identity page
    location / {
        auth_request /auth-gate;
        auth_request_set $auth_user  $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        error_page 401 = @error401;

        proxy_set_header X-Auth-Request-User  $auth_user;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_pass http://test_backend;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
