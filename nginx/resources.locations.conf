# AUTO-GENERATED by scripts/generate-proxy-conf.py — do not edit by hand
# Public base: https://proxy.bibliolatino.com/r/<name>/
# Stanzas: iop, sciencedirect, scopus, simulator

# --- IOP Science (iop) ---
location = /r/iop {
    return 302 /r/iop/;
}
location /r/iop/ {
    auth_request /auth-gate;
    auth_request_set $auth_user  $upstream_http_x_auth_request_user;
    auth_request_set $auth_email $upstream_http_x_auth_request_email;
    error_page 401 = @error401;

    rewrite ^/r/iop/(.*)$ /$1 break;
    proxy_pass https://iopscience.iop.org;
    proxy_http_version 1.1;
    proxy_set_header Host iopscience.iop.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Auth-Request-User $auth_user;
    proxy_set_header X-Auth-Request-Email $auth_email;
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout 120s;
    proxy_redirect off;
    proxy_ssl_server_name on;
    proxy_ssl_name iopscience.iop.org;

    # Keep users inside the proxy for absolute publisher URLs
    sub_filter_once off;
    sub_filter_types text/css application/javascript application/json;
    sub_filter "https://iopscience.iop.org/" "https://proxy.bibliolatino.com/r/iop/";
    sub_filter "http://iopscience.iop.org/" "https://proxy.bibliolatino.com/r/iop/";
    sub_filter "//iopscience.iop.org/" "https://proxy.bibliolatino.com/r/iop/";
    sub_filter "https://www.iop.org/" "https://proxy.bibliolatino.com/r/iop/__iop_www__/";
}

location /r/iop/__iop_www__/ {
    auth_request /auth-gate;
    error_page 401 = @error401;
    rewrite ^/r/iop/__iop_www__/(.*)$ /$1 break;
    proxy_pass https://www.iop.org;
    proxy_set_header Host www.iop.org;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding "";
    proxy_ssl_server_name on;
    proxy_ssl_name www.iop.org;
}

