worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format library_access
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'user="$http_x_auth_request_user" email="$http_x_auth_request_email" '
        'campus="$campus_ip" resource="$resource_name"';

    access_log /var/log/nginx/library_access.log library_access;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Do not send post-login redirect header on sign_out (causes redirect loops)
    map $uri $oauth2_auth_redirect {
        default                 $request_uri;
        /oauth2/sign_out        "";
    }

    # Extract /r/<name>/ for analytics logs (Milestone 4)
    map $uri $resource_name {
        default                 "-";
        ~^/r/(?<res>[^/]+)      $res;
    }

    # Institutional / campus IP allowlist (Milestone 2 — IP auth bypass)
    # Populate via INSTITUTIONAL_CIDRS in .env and scripts/render-campus-geo.sh
    include /etc/nginx/campus-ip.geo.conf;

    include /etc/nginx/conf.d/*.conf;
}
