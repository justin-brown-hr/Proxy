## oauth2-proxy — bridges Nginx auth_request to Keycloak OIDC
## Browser URLs come from env (OAUTH2_PROXY_*); container URLs stay on Docker DNS.

provider = "oidc"
client_id = "library-proxy"

http_address = "0.0.0.0:4180"
reverse_proxy = true

skip_oidc_discovery = true
insecure_oidc_skip_issuer_verification = true

# Server-side calls stay inside Docker network
redeem_url = "http://keycloak:8080/realms/library/protocol/openid-connect/token"
oidc_jwks_url = "http://keycloak:8080/realms/library/protocol/openid-connect/certs"
profile_url = "http://keycloak:8080/realms/library/protocol/openid-connect/userinfo"

email_domains = ["*"]
upstreams = ["static://202"]

# Overridden by OAUTH2_PROXY_COOKIE_SECURE in production HTTPS
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"
cookie_name = "_library_oauth2"

set_xauthrequest = true
pass_access_token = true
pass_authorization_header = true
pass_user_headers = true
set_authorization_header = true
skip_provider_button = true

scope = "openid email profile"
code_challenge_method = "S256"
